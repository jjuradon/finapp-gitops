events {
    worker_connections 1024;
}

http {
    # Security headers applied to every response
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "DENY"        always;
    add_header Referrer-Policy         "no-referrer" always;

    # Request ID forwarded to upstream services for log correlation
    map $http_x_request_id $request_id_val {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        # Routes are added here as epics complete.
        # Format:
        #   location /v1/auth/    { proxy_pass http://host.docker.internal:8000; }
        #   location /v1/accounts/ { proxy_pass http://host.docker.internal:8000; }

        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
